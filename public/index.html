<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나미 투약 수첩</title>
<meta name="description" content="나미의 약 일정을 가족이 함께 챙기는 투약 수첩">
<meta name="theme-color" content="#eef8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1d1a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="나미 투약">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 153 민트 약국 — 연민트 바탕 위 흰 카드, 행동은 짙은 민트 한 색, 늦은 투약만 호박색. 휴대폰 한 손 사용 기준 한 줄 흐름 + 하단 탭 */
:root{
  --bg:#eef8f5; --card:#ffffff; --line:#d3ece4; --fg:#12322b; --muted:#4d6b63; --faint:#6f8a83;
  --accent:#0b7a63; --accent-fg:#ffffff; --accent-soft:#d9f3ea; --chip-fg:#0b5c4a; --graph:#12a37f;
  --warn:#8f5200; --warn-bg:#fff2dc; --warn-line:#f1cf92;
  --cross:#bfe8db; --shadow:0 4px 14px rgba(20,110,90,.08); --overlay:rgba(18,50,43,.38);
  --m-mint:#12a37f; --m-sky:#2f86d0; --m-peach:#dc6f43; --m-lilac:#8467cc; --m-sun:#c99a0c;
  --font:"Pretendard","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1d1a; --card:#162824; --line:#24413a; --fg:#e6f4ef; --muted:#a3c2b9; --faint:#86a59c;
    --accent:#5fd4b4; --accent-fg:#06261f; --accent-soft:#1c3a33; --chip-fg:#a6ecd8; --graph:#5fd4b4;
    --warn:#ffc37a; --warn-bg:#3a2a16; --warn-line:#6b4a1f;
    --cross:#18332d; --shadow:0 4px 14px rgba(0,0,0,.25); --overlay:rgba(0,0,0,.55);
    --m-mint:#5fd4b4; --m-sky:#7ab8f0; --m-peach:#f2a07f; --m-lilac:#b9a3f0; --m-sun:#f0cd5a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1d1a; --card:#162824; --line:#24413a; --fg:#e6f4ef; --muted:#a3c2b9; --faint:#86a59c;
  --accent:#5fd4b4; --accent-fg:#06261f; --accent-soft:#1c3a33; --chip-fg:#a6ecd8; --graph:#5fd4b4;
  --warn:#ffc37a; --warn-bg:#3a2a16; --warn-line:#6b4a1f;
  --cross:#18332d; --shadow:0 4px 14px rgba(0,0,0,.25); --overlay:rgba(0,0,0,.55);
  --m-mint:#5fd4b4; --m-sky:#7ab8f0; --m-peach:#f2a07f; --m-lilac:#b9a3f0; --m-sun:#f0cd5a;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);margin:0;min-height:100%}
img{max-width:100%}
body{color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.c-mint{--mc:var(--m-mint)} .c-sky{--mc:var(--m-sky)} .c-peach{--mc:var(--m-peach)} .c-lilac{--mc:var(--m-lilac)} .c-sun{--mc:var(--m-sun)}

.app{position:relative;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px));min-height:100%}
.top .icon-btn{position:relative}
.bell-on::after{content:"";position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--graph);box-shadow:0 0 0 2px var(--card)}
.steps{margin:0 0 14px;padding-left:20px;color:var(--fg);font-size:15px}
.steps li{margin-bottom:6px}
.info{margin:0 0 14px;color:var(--muted);font-size:14px}
.okline{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--chip-fg);font-weight:700;margin-bottom:12px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
/* 둥근 십자 하나 — 톤의 상징 */
.app::before{content:"";position:absolute;top:-6px;right:-10px;width:120px;height:120px;z-index:0;pointer-events:none;
  background:linear-gradient(var(--cross),var(--cross)) center/40px 120px no-repeat,linear-gradient(var(--cross),var(--cross)) center/120px 40px no-repeat;border-radius:20px;opacity:.9;
  -webkit-mask:radial-gradient(circle at center,#000 70%,transparent 71%);mask:radial-gradient(circle at center,#000 70%,transparent 71%)}
.app>*{position:relative;z-index:1}

.top{display:flex;align-items:center;gap:12px;padding:8px 0 14px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.avatar svg{width:28px;height:28px;fill:var(--accent)}
.who{min-width:0;flex:1}
.who h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.who p{margin:2px 0 0;color:var(--muted);font-size:13px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){.icon-btn:hover{border-color:var(--accent)}}

.note{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px dashed var(--line);color:var(--muted);font-size:13px}
.note.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn)}

.week{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.week .icon-btn{width:36px;height:56px;font-size:20px;color:var(--muted)}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:0}
.day{border:1px solid transparent;background:transparent;border-radius:14px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:56px}
.day .wd{font-size:11px;color:var(--faint)}
.day .dn{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.day .dot{width:6px;height:6px;border-radius:50%;margin-top:2px;background:transparent}
.day .dot.done{background:var(--graph)} .day .dot.part{background:var(--line);box-shadow:inset 0 0 0 1.5px var(--graph)}
.day .dot.miss{background:var(--warn)} .day .dot.plan{background:var(--line)}
.day.today .dn{color:var(--accent)}
.day.sel{background:var(--card);border-color:var(--line);box-shadow:var(--shadow)}
@media (hover:hover){.day:hover{border-color:var(--line)}}

.summary{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:18px}
.ring{width:72px;height:72px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--accent-soft);fill:none}
.ring .bar{stroke:var(--graph);fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-variant-numeric:tabular-nums}
.ring b small{font-size:12px;color:var(--faint);font-weight:500}
.summary h2{margin:0;font-size:17px;line-height:1.35}
.summary p{margin:4px 0 0;color:var(--muted);font-size:13px}
.summary p.warn{color:var(--warn);font-weight:500}

.slot{margin-bottom:18px}
.slot h3{margin:0 0 8px 2px;font-size:13px;font-weight:500;color:var(--faint);letter-spacing:.04em}
.stack{display:flex;flex-direction:column;gap:8px}
.dose{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.dose.st-late,.dose.st-missed{border-color:var(--warn-line)}
.dose.st-now{border-color:var(--accent)}
.dose.st-given,.dose.st-skipped{box-shadow:none}
.pill{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--mc) 16%,transparent)}
.pill svg{width:24px;height:24px}
.pill .a{fill:var(--mc)} .pill .b{fill:color-mix(in srgb,var(--mc) 35%,var(--card))}
.dose-main{flex:1;min-width:0}
.dose-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dose-time{font-size:13px;font-weight:700;color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--chip-fg)}
.tag.late,.tag.missed{background:var(--warn-bg);color:var(--warn)}
.tag.skipped{background:transparent;border:1px solid var(--line);color:var(--faint)}
.dose-name{font-size:16px;font-weight:700;margin-top:1px;overflow-wrap:anywhere}
.dose-amt{font-weight:500;color:var(--muted);margin-left:6px;font-size:14px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.memo{font-size:13px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.by{margin-top:8px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.by svg{width:16px;height:16px;stroke:var(--graph);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dose.st-given .dose-name,.dose.st-skipped .dose-name{color:var(--muted)}
.dose.st-skipped .dose-name{text-decoration:line-through;text-decoration-thickness:1px}
.acts{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.btn{min-height:44px;border-radius:12px;padding:0 16px;border:1px solid transparent;font-weight:700;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.text{background:transparent;color:var(--faint);font-weight:500;min-height:36px;padding:0 6px;font-size:13px}
.btn.danger{background:transparent;border-color:var(--warn-line);color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:var(--card);border-color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
@media (hover:hover){.btn.primary:hover{filter:brightness(1.08)} .btn.ghost:hover{border-color:var(--accent)} .btn.text:hover{color:var(--fg)}}
.btn:active{transform:translateY(1px)}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.empty h3{margin:0 0 6px;color:var(--fg);font-size:17px}
.empty p{margin:0 0 16px;font-size:14px}

.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 12px}
.sec-head h2{margin:0;font-size:19px}
.sec-label{margin:20px 0 8px 2px;font-size:13px;font-weight:500;color:var(--faint);letter-spacing:.04em}
.med{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);width:100%;text-align:left}
@media (hover:hover){.med:hover{border-color:var(--accent)}}
.med.ended{box-shadow:none;opacity:.72}
.med .times{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.med .times span{font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--accent-soft);color:var(--chip-fg);font-variant-numeric:tabular-nums}
.sched{font-size:13px;color:var(--muted);margin-top:6px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;min-width:0}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.logrow{display:grid;grid-template-columns:76px 1fr auto;gap:4px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;text-align:left}
@media (hover:hover){.logrow:hover{border-color:var(--accent)}}
.logrow .d{font-weight:700;font-size:14px}
.logrow .d small{display:block;font-weight:500;color:var(--faint);font-size:12px}
.meter{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--graph);border-radius:99px}
.logrow .n{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.logrow .miss{grid-column:2/4;font-size:12px;color:var(--warn)}
.petnote{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.petnote h3{margin:0 0 4px;font-size:13px;color:var(--faint);font-weight:500}
.petnote p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 94%,transparent);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{min-height:54px;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--faint);font-size:12px;font-weight:500}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:700}

.sheet-wrap{position:fixed;inset:0;z-index:40;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -8px 30px rgba(0,0,0,.15)}
@media (min-width:600px){.sheet-wrap{align-items:center}.sheet{border-radius:22px;max-height:88%}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sheet h2{margin:0 0 14px;font-size:19px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.field>.lab{font-size:13px;font-weight:500;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inp{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-size:16px}
textarea.inp{min-height:76px;resize:vertical}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.timechips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.timechips span{display:inline-flex;align-items:center;gap:2px;padding-left:12px;border-radius:99px;background:var(--accent-soft);color:var(--chip-fg);font-weight:700;font-variant-numeric:tabular-nums}
.timechips button{width:36px;height:36px;border:0;background:transparent;color:var(--chip-fg);font-size:18px;border-radius:99px}
.addtime{display:flex;gap:8px}
.addtime .inp{flex:1}
.swatches{display:flex;gap:10px}
.swatches button{width:40px;height:40px;border-radius:50%;border:3px solid var(--card);background:var(--mc);box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.err{color:var(--warn);font-size:13px;min-height:20px;margin:-4px 0 8px}
.sheet-foot{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:6px;flex-wrap:wrap}
.sheet-foot .right{display:flex;gap:8px;margin-left:auto}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--fg);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast button{min-height:40px;border:0;border-radius:10px;padding:0 12px;background:transparent;color:var(--accent-soft);font-weight:700}
.toast.plain{padding:12px 16px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><ellipse cx="5.2" cy="10.2" rx="2.2" ry="2.8"/><ellipse cx="9.3" cy="5.6" rx="2.2" ry="2.9"/><ellipse cx="14.7" cy="5.6" rx="2.2" ry="2.9"/><ellipse cx="18.8" cy="10.2" rx="2.2" ry="2.8"/><path d="M12 11.2c-3 0-6.3 4.4-6.3 6.9 0 1.7 1.3 2.6 2.9 2.6 1.4 0 2.2-.7 3.4-.7s2 .7 3.4.7c1.6 0 2.9-.9 2.9-2.6 0-2.5-3.3-6.9-6.3-6.9z"/></svg></div>
    <div class="who"><h1 id="petName">나미</h1><p id="petSub">투약 수첩</p></div>
    <button class="icon-btn" id="bellBtn" aria-label="알림 설정"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></button>
    <button class="icon-btn" id="petBtn" aria-label="반려동물 정보 수정"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/></svg></button>
  </header>
  <p class="note" id="note">기록을 불러오는 중이에요…</p>
  <main>
    <section id="view-day"></section>
    <section id="view-meds" hidden></section>
    <section id="view-log" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="화면 전환">
  <div class="tabs-in">
    <button class="tab" data-view="day" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="m9 15 2 2 4-4"/></svg>투약</button>
    <button class="tab" data-view="meds"><svg viewBox="0 0 24 24"><rect x="2.5" y="8" width="19" height="8" rx="4" transform="rotate(-35 12 12)"/><path d="m9.2 7.9 5.6 8.2"/></svg>약 관리</button>
    <button class="tab" data-view="log"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>기록</button>
  </div>
</nav>

<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { initializeFirestore, persistentLocalCache, doc, collection, query, orderBy, limit, onSnapshot, setDoc, deleteDoc, getDocs }

const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "svg") el.innerHTML = v; // 정적 SVG만
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

function dueOn(m, k) {
  if (!m.start || k < m.start) return false;
  if (m.end && k > m.end) return false;
  return diffDays(m.start, k) % (m.every || 1) === 0;
}
function dosesFor(k) {
  const entries = S.logs[k]?.entries || {};
  const out = [];
  for (const m of S.meds) {
    if (!dueOn(m, k)) continue;
    for (const t of (m.times || [])) {
      const key = m.id + "@" + t;
      out.push({ m, t, key, e: entries[key] || null });
    }
  }
  return out.sort((a, b) => a.t.localeCompare(b.t) || a.m.name.localeCompare(b.m.name));
}
function doseState(d, k, today, now) {
  if (d.e?.s === "given") return "given";
  if (d.e?.s === "skipped") return "skipped";
  if (k < today) return "missed";
  if (k > today) return "later";
  const t = toMin(d.t);
  if (now > t + 60) return "late";
  if (now >= t - 30) return "now";
  return "later";
}
function dayStatus(k, today) {
  const ds = dosesFor(k);
  if (!ds.length) return "none";
  const done = ds.filter(d => d.e).length;
  if (done === ds.length) return "done";
  if (k < today) return "miss";
  if (k === today) return done ? "part" : "plan";
  return "plan";
}
const slotOf = t => { const m = toMin(t); return m < 660 ? "아침" : m < 900 ? "점심" : m < 1260 ? "저녁" : "밤"; };

const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const b64ToBytes = s => { const p = "=".repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function subId(endpoint) {
  const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(endpoint));
  return btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "").slice(0, 32);
}
async function currentSub() {

}

  renderHeader();
  if (S.pushOn && S.base) { // 기기 정보가 지워졌을 때를 대비해 다시 적어 둔다
    const s = await currentSub(); const j = s.toJSON();
    setDoc(ref("subs", await subId(j.endpoint)), {endpoint: j.endpoint, keys: j.keys, who: S.myName || "", seen: new Date().toISOString()}, {merge: true}).catch(() => {});
  }
}
async function enablePush(btn) {

    const reg = await navigator.serviceWorker.ready;
    let s = await reg.pushManager.getSubscription();
    if (!s) s = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC)});
    const j = s.toJSON();
    await setDoc(ref("subs", await subId(j.endpoint)), {endpoint: j.endpoint, keys: j.keys, who: S.myName || "", ua: navigator.userAgent.slice(0, 120), createdAt: new Date().toISOString()});
    S.pushOn = true; renderHeader(); toast("이 휴대폰에 알림을 켰어요"); openBellSheet();
  } catch (e) { console.error(e); btn.disabled = false; toast("알림을 켜지 못했어요. 잠시 후 다시 해 주세요."); }
}

function subscribe() {
  let firstReal = false;
  const slowTimer = setTimeout(() => { if (!firstReal) { S.slow = true; render(); } }, 10000);
  const settle = meta => {
    if (!meta.fromCache) { if (!firstReal) clearTimeout(slowTimer); firstReal = true; if (S.slow) { S.slow = false; renderNote(); } }
  };
  const onErr = e => { console.error(e); clearTimeout(slowTimer); S.slow = true; if (S.mode === "loading") { S.mode = "shared"; S.gotMeds = true; } render(); };
  const opts = {includeMetadataChanges: true};
  onSnapshot(collection(S.fs, S.base, "meds"), opts, snap => {
    S.meds = snap.docs.map(d => ({...d.data(), id: d.id})).filter(m => m.name); sortMeds();
    S.gotMeds = true; S.mode = "shared"; settle(snap.metadata); render();
  }, onErr);
  onSnapshot(query(collection(S.fs, S.base, "logs"), orderBy("date", "desc"), limit(150)), snap => {
    const L = {}; snap.docs.forEach(d => { const v = d.data(); L[v.date || d.id] = v; });
    S.logs = L; render();
  }, onErr);
  onSnapshot(ref("meta", "pet"), snap => {
    if (snap.exists()) S.pet = {...{name:"나미", species:"dog", weight:"", note:""}, ...snap.data()};
    renderHeader(); if (S.view === "log") renderLog();
  }, onErr);
}
